function tone(f,t=.08,type="square",v=.08,at=0){try{const a=ctx(),o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.001,a.currentTime+at+t);o.connect(g).connect(a.destination);o.start(a.currentTime+at);o.stop(a.currentTime+at+t)}catch(e){}}
function noise(t=.4,v=.1){try{const a=ctx(),n=a.sampleRate*t,b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),g=a.createGain();g.gain.value=v;s.buffer=b;s.connect(g).connect(a.destination);s.start()}catch(e){}}
const SFX={click:()=>tone(880,.05),open:()=>[523,659,784,1046].forEach((f,i)=>tone(f,.12,"square",.08,i*.08)),lamp:()=>{tone(300,.04);tone(500,.05,"square",.08,.05)},fire:()=>{noise(.6,.12);tone(200,.3,"sawtooth",.05)},bd:()=>[523,523,587,523,698,659].forEach((f,i)=>tone(f,.15,"square",.07,i*.16)),fall:()=>{noise(.5,.15);tone(120,.3,"triangle",.1)},unlock:()=>{tone(660,.08);tone(990,.15,"square",.08,.1)},horn:()=>tone(520,.5,"sawtooth",.07),blow:()=>noise(.5,.06),err:()=>tone(200,.15,"square",.06)};
const sfx=(...n)=>n.forEach(k=>SFX[k]&&SFX[k]());

  let t=0;N.forEach(([f,d])=>{tone(f,d*.25,"square",.08,t);t+=d*.25});

(function loop(){fx.clearRect(0,0,fw.width,fw.height);parts=parts.filter(p=>p.l-->0);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.04;fx.fillStyle=p.c;fx.fillRect(p.x|0,p.y|0,5,5)});requestAnimationFrame(loop)})();
